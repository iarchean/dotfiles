# views:
#   # Alters the pod view column layout. Uses GVR as key
#   v1/pods:
#     # Overrides default sort column
#     sortColumn: AGE:asc
#     columns:
#       - AGE
#       - NAMESPACE|WR                                     # => 🌚 Specifies the NAMESPACE column to be right aligned and only visible while in wide mode
#       - ZORG:.metadata.labels.fred\.io\.kubernetes\.blee # => 🌚 extract fred.io.kubernetes.blee label into it's own column
#       - BLEE:.metadata.annotations.blee|R                # => 🌚 extract annotation blee into it's own column and right align it
#       - NAME
#       - BLEE:.metadata.annotations.blee|R                # => 🌚 extract annotation blee into it's own column and right align it
#       - IP
#       - NODE
#       - STATUS
#       - READY
#       - MEM/RL|S                                         # => 🌚 Overrides std resource default wide attribute via `S` for `Show`
#       - '%MEM/R|'                                        # => NOTE! column names with non alpha names need to be quoted as columns must be strings!

#   v1/pods@fred:                                          # => 🌚 As of v0.40.6, you can now further customize pod view for a specific namespace
#     # Overrides default sort column
#     sortColumn: NAME:asc
#     columns:
#       - NAME|WR
#       - AGE

#   v1/pods@fred:                                          # => 🌚 New v0.40.6! Customize columns for a given resource and namespace!
#     columns:
#       - AGE
#       - NAME|WR

#   v1/pods@kube*:                                         # => 🌚 New v0.40.6! You can also specify a namespace using a regular expression.
#     columns:
#       - NAME
#       - AGE
#       - LABELS

#   cool-kid:                                              # => 🌚 New v0.40.8! You can also reference a specific alias and display a custom view for it
#     columns:
#       - AGE
#       - NAMESPACE|WR

#   # Alters the service view column layout
#   v1/services:
#     columns:
#       - AGE
#       - NAMESPACE
#       - NAME
#       - TYPE
#       - CLUSTER-IP

views:
  v1/nodes:
    columns:
      - NAME
      - STATUS
      # NOTE: k9s 只有在表达式含 >=2 个 `|` 时才走 gojq，否则当 JSONPath 解析并报错
      # (internal/render/cust_cols.go: isJQSpec)。故刻意用 `.metadata.labels | .[...]` 拆成三段。
      # GKE: spot 节点带有 cloud.google.com/gke-provisioning=spot (以及 gke-spot=true)
      - 'SPOT:.metadata.labels | .["cloud.google.com/gke-provisioning"] | if . == "spot" then "SPOT" else "-" end'
      # GKE custom compute class: default / stable-primary / cost-optimized / ci-runners ...
      - 'CLASS:.metadata.labels | .["cloud.google.com/compute-class"] | . // "-"'
      - 'MACHINE:.metadata.labels | .["node.kubernetes.io/instance-type"] | . // "-"'
      # 以下 |W = wide,平时隐藏, Ctrl-W 展开
      - TAINTS|W
      - VERSION|W
      - PODS
      - CPU
      - CPU/A
      - '%CPU'
      - MEM
      - MEM/A
      - '%MEM'
      - AGE
      # NOTE: 自定义 columns 不是"替换"而是"合并" —— k9s 会把这里没写到的默认列
      # 追加到末尾 (internal/render/cust_cols.go: ColumnSpecs.Header)。GPU 那四列在
      # 默认 header 里恰好没有 Wide 属性,不显式声明就会一直霸占屏幕。以下全部标 W 压掉。
      # ROLE 在 GKE 上恒为 <none>(无 node-role.kubernetes.io/* 标签)。注意:从列表里
      # 删掉它并不能隐藏,反而会被按默认属性追加到行尾,必须显式声明才压得住。
      - ROLE|W
      - GPU/A|W
      - GPU/C|W
      - SH-GPU/A|W
      - SH-GPU/C|W
      - ARCH|W
      - OS-IMAGE|W
      - KERNEL|W
      - INTERNAL-IP|W
      - EXTERNAL-IP|W
      - LABELS|W
      - VALID|W
  apps/v1/deployments:
    columns:
      - NAMESPACE
      - NAME
      - PROJECT:.metadata.labels.app\.kubernetes\.io/name
      - VERSION:.metadata.labels.app\.kubernetes\.io/version
      - READY
      - UP-TO-DATE
      - AVAILABLE
      - AGE
  gateway.networking.k8s.io/v1/httproutes:
    columns:
      - NAMESPACE
      - NAME
      - GATEWAY:.spec.parentRefs[0].name
      - HOSTNAMES
      - AGE
  gateway.networking.k8s.io/v1/gateways:
    columns:
      - NAMESPACE
      - NAME
      - CLASS
      - ADDRESS
      - HOSTS:.spec.listeners[*].hostname
      - PROGRAMMED
      - AGE
  cert-manager.io/v1/certificates:
    sortColumn: NOT-AFTER:asc
    columns:
      - NAMESPACE
      - NAME
      - 'READY:.status.conditions // [] | map(select(.type == "Ready") | .status) | .[0] // "-"'
      - SECRET:.spec.secretName
      - ISSUER:.spec.issuerRef.name
      - DNS:.spec.dnsNames
      - 'EXPIRES_DAYS:.status.notAfter | if . then fromdateiso8601 - now | . / 86400 | floor else "-" end'
      - NOT-AFTER:.status.notAfter
      - AGE
  # helm:
  #   columns:
  #     - NAMESPACE
  #     - NAME
  #     - REVISION
  #     - STATUS
  #     - APP:.metadata.labels.app\.kubernetes\.io/name
  #     - CHART
  #     - AGE
