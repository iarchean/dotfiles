# Extra columns overlaid on sofka built-in / CRD printer columns (originally from k9s views).
# New columns go before AGE; no replace, so sofka defaults (e.g. nodes PODS) stay.
views:
  v1/nodes:
    columns:
    - name: SPOT
      path: /metadata/labels/cloud.google.com~1gke-provisioning
    - name: CLASS
      path: /metadata/labels/cloud.google.com~1compute-class
    - name: MACHINE
      path: /metadata/labels/node.kubernetes.io~1instance-type
  apps/v1/deployments:
    columns:
    - name: PROJECT
      path: /metadata/labels/app.kubernetes.io~1name
    - name: VERSION
      path: /metadata/labels/app.kubernetes.io~1version
  cert-manager.io/v1/certificates:
    sort: EXPIRES:asc
    columns:
    - name: ISSUER
      path: /spec/issuerRef/name
    - name: DNS
      path: /spec/dnsNames
      wide: true
    - name: EXPIRES
      path: /status/notAfter
      type: time
  gateway.networking.k8s.io/v1/httproutes:
    columns:
    - name: GATEWAY
      path: /spec/parentRefs/0/name
